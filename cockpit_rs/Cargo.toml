[package]
name = "cockpit_rs"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "0.22"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zeroize = { version = "1.8", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Security_Cryptography",
    "Win32_Foundation",
    "Win32_System_Memory",
] }

[dev-dependencies]
tempfile = "3.14"
